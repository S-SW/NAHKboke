<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="blog.css" />
    <title>NAHK 的个人日记</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"
    />
    <link rel="icon" type="image/png" href="tx_circle.png" />
    <style>
      /* 返回按钮样式 */
      .back-home {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--accent-color);
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 25px;
      }
      .back-home:hover {
        text-decoration: underline;
      }

      /* ==================== 1. 更加宽松、全屏的瀑布流画廊布局 ==================== */
      .diary-gallery {
        display: flex;
        flex-wrap: wrap; /* 允许卡片折行平铺 */
        gap: 24px; /* 【调大】卡片之间的基础间距，更加宽松 */
        width: 100%;
        justify-content: center; /* 居中错落分布 */
        padding: 20px 0;
      }

      /* 当屏幕比较窄（比如手机端）时，自动缩减为一列展示 */
      @media (max-width: 768px) {
        .diary-gallery {
          column-count: 1;
        }
      }

      /* ==================== 错落卡片基础样式 ==================== */
      .my-diary-item {
        /* 基础结构 */
        background: var(--card-bg-day) !important;
        border: 1px solid rgba(0, 0, 0, 0.05) !important;
        border-radius: 16px !important; /* 【调大】圆角更现代 */
        padding: 20px !important; /* 【调大】内边距，让卡片内部更舒缓 */
        box-shadow: 2px 4px 16px rgba(0, 0, 0, 0.04);
        display: flex;
        flex-direction: column;

        /* 丝滑的交互过渡 */
        transition:
          transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
          box-shadow 0.3s,
          border-color 0.3s !important;
      }

      /* 暗黑模式质感 */
      body.dark .my-diary-item {
        background: #1e293b !important;
        border: 1px solid rgba(255, 255, 255, 0.04) !important;
        box-shadow: 4px 6px 20px rgba(0, 0, 0, 0.25);
      }

      /* 鼠标悬浮到某个卡片时：立刻“摆正”并放大拔高 */
      .my-diary-item:hover {
        transform: scale(1.08) rotate(0deg) translateY(-8px) !important; /* 强制拉正浮起（大卡片缩放1.08最舒适） */
        z-index: 50; /* 悬浮时处于最上层，不被挡住 */
        box-shadow: 0 15px 30px rgba(99, 102, 241, 0.25) !important;
        border-color: rgba(99, 102, 241, 0.5) !important;
      }

      /* 调整卡片内的元素 */
      .diary-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .diary-user {
        font-size: 12px;
        font-weight: 600;
        color: var(--accent-color);
      }
      .diary-time {
        color: #64748b;
        font-size: 11px;
      }

      /* 日记内容文本排版 */
      .diary-content {
        font-size: 15px;
        line-height: 1.65;
        word-wrap: break-word;
        white-space: pre-wrap; /* 保留换行符 */
      }
    </style>
  </head>
  <body class="dark">
    <nav>
      <div class="logo">NAHKder日记</div>
      <button class="mode-btn" id="modeBtn">
        <i class="fa fa-moon-o"></i> 夜间模式
      </button>
    </nav>

    <!-- 【布局调整】移除了 max-width: 900px，改为 100% 宽度实现全屏布局 -->
    <div
      class="container"
      style="grid-template-columns: 1fr; max-width: 100%; width: 100%; padding: 20px 40px; box-sizing: border-box;"
    >
      <a href="index.html" class="back-home"
        ><i class="fa fa-arrow-left"></i> 返回主页板</a
      >

      <!-- 用于展示的画廊容器 -->
      <div class="diary-gallery" id="myDiaryList">
        <div style="text-align:center; color:#94a3b8; font-size:14px; padding: 60px 0; width:100%;">
          <i class="fa fa-spinner fa-spin"></i> 正在唤醒深处记忆...
        </div>
      </div>
    </div>

    <script>
      const SUPABASE_URL = "https://gtgmqumuqxnuvoacsnxg.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0Z21xdW11cXhudXZvYWNzbnhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NTA3NzIsImV4cCI6MjA5NTUyNjc3Mn0.7sI9kmqymPr0LiZJodd4oZj3oF4GJYTewcYknVFxrwA";
      const headers = {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
      };

      // 主题控制逻辑
      const modeBtn = document.getElementById("modeBtn");
      const body = document.body;
      let isDark = localStorage.getItem("theme_dark") !== "false";

      function updateThemeUI() {
        if (isDark) {
          body.classList.add("dark");
          modeBtn.innerHTML = '<i class="fa fa-sun-o"></i> 日间模式';
        } else {
          body.classList.remove("dark");
          modeBtn.innerHTML = '<i class="fa fa-moon-o"></i> 夜间模式';
        }
      }
      updateThemeUI();

      modeBtn.addEventListener("click", () => {
        isDark = !isDark;
        localStorage.setItem("theme_dark", isDark);
        updateThemeUI();
      });

      // 安全防注入转义函数
      function escapeHtml(str) {
        return String(str).replace(
          /[&<>\"']/g,
          (s) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[s],
        );
      }

      const myDiaryList = document.getElementById("myDiaryList");

      async function fetchMyDiaries() {
        try {
          const response = await fetch(`${SUPABASE_URL}/rest/v1/diary`, {
            method: "GET",
            headers: headers,
          });
          
          if (!response.ok) {
            throw new Error(`服务器响应失败 (状态码: ${response.status})`);
          }
          
          let list = await response.json();

          // 按时间倒序排列
          list.sort((a, b) => {
            let timeA = new Date(a.time.replace(/-/g, '/')).getTime() || 0;
            let timeB = new Date(b.time.replace(/-/g, '/')).getTime() || 0;
            return timeB - timeA;
          });

          myDiaryList.innerHTML = "";
          if (list.length === 0) {
            myDiaryList.innerHTML = `<div style="text-align:center; color:#94a3b8; font-size:14px; padding: 60px 0; width:100%;">目前还没有写下任何日记哦~</div>`;
            return;
          }

          list.forEach((item) => {
            const div = document.createElement("div");
            div.className = "my-diary-item";

            // 🎲 调整随机算法，让大卡片更加和谐 🎲
            const randomRotate = (Math.random() * 6 - 3).toFixed(1); // 【收敛角度】大卡片适合微调，旋转控制在 -3deg ~ +3deg 之间
            const randomY = (Math.random() * 16 - 8).toFixed(0); // 高低错落 (-8px ~ +8px)
            const randomWidth = Math.floor(Math.random() * 80) + 280; // 【卡片变大】卡片宽度随机范围调大为 (280px ~ 360px)
            const randomFontSize = (Math.random() * 2 + 14).toFixed(1); // 【字号微调】更加舒缓的字号 (14px ~ 16px)

            div.style.transform = `rotate(${randomRotate}deg) translateY(${randomY}px)`;
            div.style.width = `${randomWidth}px`;
            div.style.fontSize = `${randomFontSize}px`;

            // 📅 【显示具体几点几分】提取完整的“年-月-日 时:分”，过滤掉可能存在的秒数尾巴
            let fullTimeStr = "未知时间";
            if (item.time) {
              // 假设格式为 "2026-05-31 15:57:02" -> 截取为 "2026-05-31 15:57"
              const parts = item.time.split(":");
              if (parts.length >= 2) {
                fullTimeStr = parts[0] + ":" + parts[1];
              } else {
                fullTimeStr = item.time;
              }
            }
            
            const recordName = item.nickname || "NAHK";

            div.innerHTML = `
              <div class="diary-meta">
                <span class="diary-user"><i class="fa fa-bookmark"></i> ${escapeHtml(recordName)}</span>
                <span class="diary-time"><i class="fa fa-clock-o"></i> ${escapeHtml(fullTimeStr)}</span>
              </div>
              <div class="diary-content" style="font-size: inherit; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word;">${escapeHtml(item.content)}</div>
            `;
            myDiaryList.appendChild(div);
          });
        } catch (e) {
          console.error(e);
          myDiaryList.innerHTML = `<div style="text-align:center; color:#ef4444; font-size:14px; padding: 60px 0; width:100%;"><i class="fa fa-exclamation-triangle"></i> 数据唤醒失败: ${e.message}</div>`;
        }
      }

      // 执行加载
      fetchMyDiaries();
    </script>
  </body>
</html>
