<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的个人博客 | 温柔且自由</title>
    <!-- 引入图标库 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"
    />
    <style>
      /* 全局重置 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
          sans-serif;
        transition: all 0.4s ease;
      }

      /* 全屏背景 */
      body {
        width: 100vw;
        height: 100vh;
        overflow-x: hidden;
        background: url("https://picsum.photos/id/1043/1920/1080") no-repeat
          center center;
        background-size: cover;
        transition: background 0.4s ease;
      }

      /* 夜间模式背景 */
      body.dark {
        background: url("https://picsum.photos/id/1019/1920/1080") no-repeat
          center center;
        background-size: cover;
      }

      /* 全局磨砂遮罩 */
      .bg-mask {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: -1;
      }

      body.dark .bg-mask {
        background: rgba(0, 0, 0, 0.25);
      }

      /* 顶部导航栏 */
      nav {
        width: 90%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        font-size: 24px;
        font-weight: 600;
        color: #fff;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .mode-btn {
        padding: 10px 20px;
        border: none;
        border-radius: 50px;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }

      .mode-btn:hover {
        background: rgba(255, 255, 255, 0.4);
        transform: translateY(-2px);
      }

      body.dark .mode-btn {
        background: rgba(0, 0, 0, 0.3);
      }

      body.dark .mode-btn:hover {
        background: rgba(0, 0, 0, 0.5);
      }

      /* 主容器 */
      .container {
        width: 90%;
        max-width: 1200px;
        margin: 40px auto;
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 30px;
      }

      /* iOS磨砂卡片通用样式 */
      .ios-card {
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
        padding: 30px;
        color: #fff;
      }

      body.dark .ios-card {
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      }

      /* 左侧个人信息卡片 */
      .info-card {
        position: sticky;
        top: 40px;
        height: fit-content;
        text-align: center;
      }

      .avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        margin: 0 auto 20px;
        border: 3px solid rgba(255, 255, 255, 0.4);
        object-fit: cover;
      }

      .info-card h2 {
        font-size: 26px;
        margin-bottom: 10px;
        font-weight: 600;
      }

      .info-card .desc {
        font-size: 15px;
        line-height: 1.8;
        opacity: 0.95;
        margin-bottom: 20px;
      }

      .info-list {
        text-align: left;
        line-height: 2.2;
        font-size: 14px;
      }

      .info-list i {
        margin-right: 10px;
        width: 20px;
      }

      /* 右侧日记区域 */
      .diary-card {
        min-height: 600px;
      }

      .card-title {
        font-size: 22px;
        margin-bottom: 25px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* 发布日记表单 */
      .diary-input {
        width: 100%;
        padding: 18px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(8px);
        color: #fff;
        font-size: 15px;
        resize: none;
        min-height: 120px;
        margin-bottom: 15px;
        outline: none;
      }

      body.dark .diary-input {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .diary-input::placeholder {
        color: rgba(255, 255, 255, 0.7);
      }

      .publish-btn {
        padding: 12px 30px;
        border: none;
        border-radius: 50px;
        background: rgba(70, 150, 255, 0.6);
        backdrop-filter: blur(10px);
        color: #fff;
        font-size: 15px;
        cursor: pointer;
        float: right;
      }

      .publish-btn:hover {
        background: rgba(70, 150, 255, 0.8);
        transform: translateY(-2px);
      }

      /* 日记列表 */
      .diary-list {
        margin-top: 40px;
        clear: both;
      }

      .diary-item {
        padding: 20px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        margin-bottom: 20px;
      }

      body.dark .diary-item {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .diary-time {
        font-size: 12px;
        opacity: 0.8;
        margin-bottom: 10px;
      }

      .diary-content {
        font-size: 15px;
        line-height: 1.8;
      }

      /* 适配移动端 */
      @media (max-width: 900px) {
        .container {
          grid-template-columns: 1fr;
        }
        .info-card {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <!-- 全局磨砂背景遮罩 -->
    <div class="bg-mask"></div>

    <!-- 顶部导航 -->
    <nav>
      <div class="logo">我的小博客</div>
      <button class="mode-btn" id="modeBtn">
        <i class="fa fa-moon-o"></i> 夜间模式
      </button>
    </nav>

    <!-- 主内容区 -->
    <div class="container">
      <!-- 左侧个人信息 -->
      <div class="ios-card info-card">
        <img
          src="https://picsum.photos/id/64/200/200"
          alt="头像"
          class="avatar"
        />
        <h2>Hello，我是博主</h2>
        <p class="desc">热爱生活，记录日常｜温柔上进，慢慢发光✨</p>
        <div class="info-list">
          <p><i class="fa fa-user-o"></i>昵称：小拾光</p>
          <p><i class="fa fa-calendar-o"></i>年龄：20+</p>
          <p><i class="fa fa-map-marker"></i>坐标：人间烟火</p>
          <p><i class="fa fa-heart-o"></i>爱好：记录、生活、治愈一切</p>
          <p>
            <i class="fa fa-comment-o"></i
            >简介：平凡日子里，收集所有温柔与美好，用文字记录岁岁年年。
          </p>
        </div>
      </div>

      <!-- 右侧日记区域 -->
      <div class="ios-card diary-card">
        <h3 class="card-title"><i class="fa fa-book-o"></i>我的日记碎碎念</h3>
        <textarea
          class="diary-input"
          id="diaryInput"
          placeholder="写下今日心情、日常、感悟..."
        ></textarea>
        <button class="publish-btn" id="publishBtn">发布日记</button>

        <div class="diary-list" id="diaryList">
          <!-- 日记动态添加区域 -->
        </div>
      </div>
    </div>

    <script>
      // 日夜模式切换
      const modeBtn = document.getElementById("modeBtn");
      const body = document.body;
      let isDark = false;

      modeBtn.addEventListener("click", () => {
        isDark = !isDark;
        body.classList.toggle("dark");
        if (isDark) {
          modeBtn.innerHTML = '<i class="fa fa-sun-o"></i> 日间模式';
        } else {
          modeBtn.innerHTML = '<i class="fa fa-moon-o"></i> 夜间模式';
        }
      });

      // 日记发布功能 + 本地存储
      const publishBtn = document.getElementById("publishBtn");
      const diaryInput = document.getElementById("diaryInput");
      const diaryList = document.getElementById("diaryList");

      // 获取本地存储日记
      function getDiary() {
        return JSON.parse(localStorage.getItem("myDiary")) || [];
      }

      // 渲染日记
      function renderDiary() {
        const list = getDiary();
        diaryList.innerHTML = "";
        list.reverse().forEach((item) => {
          const div = document.createElement("div");
          div.className = "diary-item";
          div.innerHTML = `
                    <div class="diary-time">${item.time}</div>
                    <div class="diary-content">${item.content}</div>
                `;
          diaryList.appendChild(div);
        });
      }

      // 首次加载渲染
      renderDiary();

      // 发布日记
      publishBtn.addEventListener("click", () => {
        const content = diaryInput.value.trim();
        if (!content) {
          alert("请输入日记内容！");
          return;
        }
        // 获取当前时间
        const now = new Date();
        const time = `${now.getFullYear()}-${(now.getMonth() + 1).toString().padStart(2, "0")}-${now.getDate().toString().padStart(2, "0")} ${now.getHours().toString().padStart(2, "0")}:${now.getMinutes().toString().padStart(2, "0")}`;

        const list = getDiary();
        list.push({ content, time });
        localStorage.setItem("myDiary", JSON.stringify(list));

        // 清空输入框，重新渲染
        diaryInput.value = "";
        renderDiary();
      });
    </script>
  </body>
</html>
